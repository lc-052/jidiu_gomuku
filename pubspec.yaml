name: gomuku
description: 寄丢五子棋 - A Gomoku board game
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  socket_io_client: ^3.0.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  cupertino_icons: ^1.0.8
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: false
  # 自适应图标：纯白底 + 缩小到安全区的前景
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
