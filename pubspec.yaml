name: gomuku
description: 寄丢棋室 - Flutter 五子棋与围棋对战应用
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  socket_io_client: ^3.0.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  cupertino_icons: ^1.0.8
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  test: ^1.31.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: false
  # 自适应图标：米白底 + 安全区前景
  adaptive_icon_background: "#FFFDF3"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
