# Upload the server source files to /opt/jidiu-gomuku/server first.
# In 1Panel create a Compose using the editor, then paste this file.
services:
  jidiu-gomuku:
    build:
      context: /opt/jidiu-gomuku/server
    image: jidiu-gomuku-server:local
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
